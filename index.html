<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* ============ 1. DESIGN TOKENS ============ */
:root{
  --bg:#F0F1F5; --card:#FFFFFF; --ink:#0E1016; --ink2:#5A6070; --line:rgba(14,16,22,.09);
  --acc:#3B4CFF; --acc-ink:#FFFFFF; --ok:#1E9E5A; --warn:#D9822B;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.85); --edge-dim:rgba(255,255,255,.35); --shade:rgba(20,24,48,.16);
  --tile-l:88%; --tile-s:62%;
  --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:12px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;
  --blur:22px; --sat:185%;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.35,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#08090D; --card:#15171F; --ink:#F4F5F9; --ink2:#9AA0B2; --line:rgba(255,255,255,.09);
  --acc:#6F7CFF; --acc-ink:#0A0B12;
  --glass:rgba(34,36,48,.48); --glass-strong:rgba(34,36,48,.72);
  --edge:rgba(255,255,255,.26); --edge-dim:rgba(255,255,255,.1); --shade:rgba(0,0,0,.5);
  --tile-l:26%; --tile-s:42%;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#D5D8E2;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
[data-theme=dark] body{background:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;min-width:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}

/* ============ 2. APP SHELL ============ */
#app{position:relative;width:min(390px,100vw);height:min(844px,100dvh);background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:500px){#app{border-radius:48px;box-shadow:0 30px 80px var(--shade),0 0 0 10px #101116}}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--top) + 12px) var(--s2) var(--pb);background:var(--bg);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),transform .4s var(--ease);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;visibility:visible}
.screen.detail{z-index:20;transform:translateX(100%);opacity:1;visibility:visible;box-shadow:-20px 0 40px var(--shade)}
.screen.detail.in{transform:none}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:var(--s1)}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:-.8px}
.hdr .row{display:flex;gap:var(--s1)}
h2{font-size:20px;font-weight:650;letter-spacing:-.3px;margin:var(--s3) 0 12px}
.muted{color:var(--ink2);font-size:13px}

/* ============ 3. LIQUID GLASS COMPONENTS ============ */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  box-shadow:inset 0 0 0 1px var(--edge-dim),inset 0 1.5px 0 var(--edge),inset 0 -8px 14px -10px var(--edge-dim),0 10px 30px var(--shade)}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.gbtn:active{transform:scale(.92)}
.gbtn,.chip,.cta{transition:transform .25s var(--spring),background .2s}
.gcard{border-radius:var(--r-lg);padding:var(--s2)}
.cta{height:52px;border-radius:26px;background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:16px;padding:0 var(--s3);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:scale(.97)}
.cta.ghost{background:var(--glass);color:var(--ink)}
/* floating bottom bar + sliding pill */
.bar{position:absolute;left:50%;bottom:calc(var(--bot) + 22px);width:236px;height:68px;margin-left:-118px;border-radius:34px;padding:6px;display:flex;z-index:30;transition:transform .5s var(--ease),opacity .3s}
.bar.hide{transform:translateY(140px);opacity:0;pointer-events:none}
.bar .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:28px;background:var(--glass-strong);
  box-shadow:inset 0 0 0 1px var(--edge),0 4px 14px var(--shade);transition:transform .55s var(--spring),opacity .25s}
.bar[data-i="1"] .pill{transform:translateX(100%)}
.bar[data-i="-1"] .pill{opacity:0}
.bar .item{position:relative;flex:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);transition:color .25s}
.bar .item[aria-current=true]{color:var(--acc)}
/* chips */
.chips{display:flex;gap:var(--s1);overflow-x:auto;margin:0 calc(-1*var(--s2));padding:4px var(--s2);scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
/* side half-sheet */
.scrim{position:absolute;inset:0;background:rgba(6,8,16,.42);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.side{position:absolute;top:0;bottom:0;right:0;width:80%;z-index:41;border-radius:var(--r-xl) 0 0 var(--r-xl);padding:calc(var(--top) + 16px) var(--s2) calc(var(--bot) + 16px);transform:translateX(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;gap:var(--s2);touch-action:pan-y;background:var(--glass-strong)}
.side.on{transform:none}
.seg{position:relative;display:flex;padding:4px;border-radius:22px;background:var(--line)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:18px;background:var(--card);box-shadow:0 2px 8px var(--shade);transition:transform .45s var(--spring)}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;flex:1;min-height:40px;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button[aria-selected=true]{color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;text-align:start;min-height:52px;padding:0 8px;border-radius:var(--r-md);font-size:16px;font-weight:500}
.menu button:active{background:var(--line)}
.menu .grow{flex:1}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px var(--shade);transition:transform .35s var(--spring)}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
/* bottom modal sheet */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:51;border-radius:var(--r-xl);padding:var(--s3) var(--s2) var(--s2);transform:translateY(120%);transition:transform .5s var(--ease);background:var(--glass-strong)}
.sheet.on{transform:none}
.sheet h3{font-size:20px;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:12px;border-radius:var(--r-md);margin-top:8px;background:var(--card);min-height:64px}
.opt b{display:block;font-size:16px} .opt span.muted{display:block}
/* toast */
#toast{position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-90px);z-index:60;padding:12px 18px;border-radius:22px;font-size:14px;font-weight:600;max-width:88%;transition:transform .5s var(--spring);text-align:center}
#toast.on{transform:translate(-50%,0)}

/* ============ 4. CONTENT (cards, grids, skeleton) ============ */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);margin-bottom:12px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;min-width:0}
.tile{position:relative;display:grid;place-items:center;background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 45% 38%);overflow:hidden}
[data-theme=dark] .tile{color:hsl(var(--h) 60% 74%)}
.tile .ic{width:44px;height:44px;stroke-width:1.4}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--s2));padding:0 var(--s2) 8px;scrollbar-width:none}
.niche{position:relative;overflow:hidden;flex:none;width:286px;height:176px;border-radius:var(--r-lg);scroll-snap-align:start;text-align:start;padding:0;min-height:0}
.niche .tile{position:absolute;inset:0}
.niche .tile .ic{width:72px;height:72px;stroke-width:1.2;opacity:.55}
.niche .cap{position:absolute;left:10px;right:10px;bottom:10px;border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.niche .cap b{display:block;font-size:16px} .niche .cap span{font-size:12px;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:650}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{text-align:start;display:block;min-height:0;padding:0;min-width:0}
.pc .tile{aspect-ratio:1/1.05;border-radius:var(--r-lg);margin-bottom:8px}
.pc b{display:block;font-size:15px;font-weight:600;line-height:1.25} .pc .p{font-weight:700;margin-top:2px}
.pc .by{display:flex;align-items:center;gap:4px}
.sk{border-radius:var(--r-lg);background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 24px;color:var(--ink2)}
.sticky-cta{position:absolute;left:var(--s2);right:var(--s2);bottom:calc(var(--bot) + 16px);display:flex;gap:10px;z-index:5}
.sticky-cta .cta{flex:1}
.note{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;margin-top:12px;border-radius:var(--r-md);padding:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
/* feed */
#feed{padding:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;color:#fff}
.reel .tile{position:absolute;inset:0;color:rgba(255,255,255,.25);background:hsl(var(--h) 45% 30%)}
.reel .tile .ic{width:120px;height:120px;stroke-width:1}
.reel .info{position:absolute;left:var(--s2);right:84px;bottom:130px;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.reel .info::before{content:"";position:absolute;inset:-120px -40px -130px -40px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:-1}
.reel .info h3{font-size:22px;margin:6px 0 4px} .reel .info p{font-size:14px;opacity:.92}
.reel .acts{position:absolute;right:12px;bottom:130px;display:flex;flex-direction:column;gap:12px}
.reel .acts button{color:#fff} .reel .acts .on{color:#FF5C7A}
.reel .acts .on .ic{fill:currentColor}
.feed-top{position:absolute;top:calc(var(--top) + 12px);left:var(--s2);z-index:6;color:#fff;font-size:20px;font-weight:700;pointer-events:none}
/* ai */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.4;animation:pop .4s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-end-end-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-end-start-radius:6px}
.typing{display:flex;gap:4px;padding:14px} .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:bl 1s infinite} .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.4}}
.inbar{position:absolute;left:var(--s2);right:var(--s2);bottom:calc(var(--bot) + 100px);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;border-radius:28px;z-index:6}
.inbar input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;min-width:0}
.inbar .send{background:var(--acc);color:var(--acc-ink);border-radius:50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ============ 4b. STAGE 1.5 FIXES: bar contrast, art, cards, detail layout ============ */
:root{--pb:calc(114px + var(--bot))}
[data-theme=dark]{--acc:#93A0FF}
.bar{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(30px) saturate(210%);backdrop-filter:blur(30px) saturate(210%)}
[data-theme=dark] .bar{background:rgba(28,30,42,.34)}
.bar .pill{background:rgba(255,255,255,.94)}
[data-theme=dark] .bar .pill{background:rgba(255,255,255,.2)}
.bar .item{color:var(--ink)} .bar .item[aria-current=true]{color:var(--acc)}
.by{display:flex;align-items:center;gap:6px;min-width:0}
.art{width:100%;height:100%;display:block}
.screen.detail{padding:0;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;padding-bottom:var(--pb);scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.body{padding:20px 16px 0}
.pc{display:block;min-width:0;cursor:pointer}
.pc .img{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;margin-bottom:8px;box-shadow:0 10px 22px -12px var(--shade)}
.pc .t{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .p{font-weight:700;font-size:16px;margin:2px 0}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;min-width:0;min-height:0;color:var(--ink)}
.heart::before{content:"";position:absolute;inset:-4px}
.heart.on{color:#FF4D6D}.heart.on .ic{fill:currentColor}
.sh{display:flex;align-items:center;justify-content:space-between;margin:28px 0 8px}.sh h2{margin:0}
.link{color:var(--acc);font-weight:600;font-size:15px;padding:0 4px}
.collage{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:100%}
.collage>div{overflow:hidden;position:relative}.collage>div:first-child{grid-row:span 2}
.niche .collage{position:absolute;inset:0}
.hero{position:relative;height:240px;border-radius:0 0 28px 28px;overflow:hidden}
.hero .cap{position:absolute;left:12px;right:12px;bottom:12px;border-radius:22px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--glass-strong)}
.hero .cap b{display:block;font-size:20px;letter-spacing:-.3px}
.cr{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;margin-top:2px}
.av{width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.topbtns{position:absolute;left:12px;right:12px;top:calc(var(--top) + 12px);display:flex;justify-content:space-between;z-index:7;pointer-events:none}.topbtns>*{pointer-events:auto}
.galw{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:4/5;border-radius:0 0 28px 28px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:center}
.dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px 10px;border-radius:14px;background:var(--glass-strong)}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ink);opacity:.35;transition:width .3s var(--spring),opacity .3s}.dots i.on{width:18px;opacity:1}
.abar{position:absolute;left:12px;right:12px;bottom:calc(var(--bot) + 12px);height:72px;border-radius:36px;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 24px;z-index:6}
.abar b{display:block;font-size:22px;letter-spacing:-.4px}
.abar .cta{height:52px}
.reel .bg{position:absolute;inset:0}
.car{scroll-padding-inline:16px}
.niche .cap{background:var(--glass-strong)}
.bar{background:rgba(255,255,255,.52)}
[data-theme=dark] .bar{background:rgba(28,30,42,.55)}
.abar{background:var(--glass-strong)}
.reel .badge{background:rgba(0,0,0,.35)}
/* compact bar, FAB, left-side menu */
.bar{width:180px;height:58px;margin-left:-90px;padding:4px;border-radius:29px}
.bar .pill{top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:25px}
.bar .item{border-radius:25px;font-size:10px;gap:1px;min-height:0}
.bar .ic{width:22px;height:22px}
.ic.nav{stroke-width:2}
.fab{position:absolute;right:16px;bottom:calc(var(--bot) + 28px);width:46px;height:46px;min-width:0;min-height:0;border-radius:50%;display:grid;place-items:center;z-index:30;color:var(--acc);transition:transform .5s var(--ease),opacity .3s}
.fab:active{transform:scale(.92)}
.fab.hide{transform:translateY(120px) scale(.8);opacity:0;pointer-events:none}
.hdr{justify-content:flex-start;gap:12px}
.side{right:auto;left:0;border-radius:0 var(--r-xl) var(--r-xl) 0;transform:translateX(-104%)}
/* top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 10px) 16px 10px;pointer-events:none;transition:transform .5s var(--ease),opacity .3s,padding .35s var(--ease)}
#top>*{pointer-events:auto}
#top.hide{transform:translateY(-100px);opacity:0}#top.hide>*{pointer-events:none}
#top.sm{padding-top:calc(var(--top) + 6px);padding-bottom:6px}
#top .search{flex:1;margin:0;height:48px;padding:0 16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-dim),inset 0 1.5px 0 var(--edge),0 10px 30px var(--shade);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));transition:height .35s var(--ease)}
#top.sm .search{height:38px}
#top .gbtn{transition:transform .35s var(--ease)}#top.sm .gbtn{transform:scale(.88)}
#top .ttl{display:none;font-size:22px;font-weight:700;letter-spacing:-.4px}
#top[data-tab=ai] .search{display:none}#top[data-tab=ai] .ttl{display:block}
#market,#ai{padding-top:calc(var(--top) + 76px)}
/* draggable translucent pill */
.bar{touch-action:none;user-select:none;-webkit-user-select:none}
.bar .pill{transform:none!important;translate:calc(var(--i,0)*100% + var(--dx,0px)) 0;scale:var(--s,1);transition:translate .55s var(--spring),scale .4s var(--spring),opacity .25s,background .3s;background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px var(--edge),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -6px 10px -6px rgba(255,255,255,.4),0 6px 18px var(--shade)}
[data-theme=dark] .bar .pill{background:rgba(255,255,255,.13)}
.bar[data-i="1"]{--i:1}
.bar.drag .pill{transition:scale .4s var(--spring),opacity .25s,background .3s}
.bar.press{--s:1.2}.bar.press .pill{opacity:1;background:rgba(255,255,255,.44)}
[data-theme=dark] .bar.press .pill{background:rgba(255,255,255,.22)}
/* ---- sheet: logo, swappable body, chats, account ---- */
.side{padding-top:calc(var(--top) + 12px)}
.side-logo{height:44px;display:flex;align-items:center}.side-logo img{height:38px;width:auto;display:block}
.side-body{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--edge-dim);padding-top:12px;scrollbar-width:none}
.side-body.swap{animation:swap .45s var(--ease)}@keyframes swap{from{opacity:0;transform:translateY(8px)}}
.ch-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.ch-h h2{margin:0;font-size:26px}
.ch{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 4px;text-align:start;border-radius:12px}.ch:active{background:var(--line)}
.ch .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}.ch .when{flex:none;color:var(--ink2);font-size:13px}
.ch-g{font-size:13px;font-weight:650;color:var(--ink2);margin:16px 4px 4px}
.acct{border-top:1px solid var(--edge-dim);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.acct-row{display:flex;align-items:center;gap:12px}.acct-row b{display:block;font-size:17px}
.av2{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.cta.up{height:48px;width:100%;font-size:16px}
.chip.on{background:var(--acc);color:var(--acc-ink)}
/* bar: gentle squish while the pill is dragged */
.bar{transition:transform .5s var(--ease),opacity .3s,scale .6s var(--spring)}
.bar.squish{scale:.94}
.bar.pulse{animation:pulse .6s var(--ease)}@keyframes pulse{0%,100%{scale:1}40%{scale:.95}}
/* feed header */
#feedTop{position:absolute;top:0;left:0;right:0;z-index:25;padding:calc(var(--top) + 10px) 16px 20px;text-align:center;color:#fff;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none;opacity:0;transform:translateY(-110%);transition:transform .5s var(--ease),opacity .35s}
#feedTop.on{opacity:1;transform:none}#feedTop.on.hide{opacity:0;transform:translateY(-110%)}
#feedTop button{pointer-events:auto}
.ft-title{display:flex;align-items:center;justify-content:center;gap:12px}
.ft-title span{font-family:"Playfair Display","Iowan Old Style",Palatino,Georgia,serif;font-style:italic;font-weight:600;font-size:36px;letter-spacing:.5px;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.ft-title i{position:relative;width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85))}
.ft-title i::after{content:"";position:absolute;right:-3px;top:-2.5px;width:6px;height:6px;background:#fff;transform:rotate(45deg)}
.ft-title i:last-child{transform:scaleX(-1)}
.ft-tabs{display:flex;justify-content:center;gap:6px;margin-top:-2px}
.ft-tabs button{position:relative;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:rgba(255,255,255,.72);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ft-tabs button.on{color:#fff}.ft-tabs button.on::after{content:"";position:absolute;left:50%;bottom:6px;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:#fff}
/* ---- sheet menu in sidebar style ---- */
.menu button{min-height:52px;padding:0 14px;border-radius:18px;color:var(--ink2);font-weight:550}
.menu button.sel{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 2px 10px -4px var(--shade)}
.menu hr{border:0;height:1px;background:var(--line);margin:10px 8px}
.bdg{min-width:28px;height:26px;padding:0 9px;border-radius:13px;background:rgba(59,76,255,.12);color:var(--acc);font-size:13px;font-weight:700;display:grid;place-items:center}
[data-theme=dark] .bdg{background:rgba(147,160,255,.16)}
.acct{border-top:0;padding-top:4px;gap:8px}
.card2{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:10px 12px 10px 14px;min-height:64px;box-shadow:0 2px 12px -6px var(--shade)}
.card2 .grow{flex:1;min-width:0}.card2 b{display:block;font-size:16px}
.card2 .av2{width:42px;height:42px}
.upg{min-height:36px;min-width:0;padding:0 14px;border-radius:18px;background:rgba(59,76,255,.12);color:var(--acc);font-weight:650;font-size:14px}
[data-theme=dark] .upg{background:rgba(147,160,255,.16)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 5px var(--line);margin:0 4px;flex:none;transition:background .3s,box-shadow .3s}
.dot.on{background:var(--ok);box-shadow:0 0 0 5px rgba(30,158,90,.2)}
.swb{display:grid;place-items:center;min-width:52px}
.side[data-tab=ai] #anonCard{display:none}
/* ---- Blex AI page ---- */
#ai{padding-bottom:calc(var(--bot) + 270px)}
#top[data-tab=ai] .ttl{display:none}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.has-chat .welcome{display:none}
.wl{position:relative}.wl img{height:76px;width:auto;display:block}
.aibadge{position:absolute;top:-8px;right:-26px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--acc);background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--edge),0 4px 12px var(--shade)}
.welcome h1{font-size:34px;letter-spacing:-.8px;margin-top:18px}
.welcome .sub{color:var(--acc);font-weight:650;font-size:17px;margin-top:6px}
.welcome .hint{color:var(--ink2);font-size:16px;margin:10px 0 26px}
.sgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.sg{display:flex;flex-direction:column;gap:14px;min-height:132px;padding:16px;border-radius:26px;background:var(--card);text-align:start;box-shadow:0 10px 26px -16px var(--shade);transition:transform .3s var(--spring)}
.sg:active{transform:scale(.97)}.sg b{font-size:16.5px;line-height:1.28;font-weight:650}
.sgi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.sgi.b{background:rgba(59,76,255,.12);color:var(--acc)}.sgi.g{background:rgba(30,158,90,.14);color:#1E9E5A}
.sgi.c{background:rgba(20,150,200,.14);color:#1496C8}.sgi.p{background:rgba(140,80,220,.14);color:#8C50DC}
[data-theme=dark] .sgi.b{color:#93A0FF}[data-theme=dark] .sgi.g{color:#4CD08A}[data-theme=dark] .sgi.c{color:#5CC4EC}[data-theme=dark] .sgi.p{color:#B98CF5}
.composer{position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 112px);border-radius:30px;padding:14px 12px 10px 20px;display:flex;flex-direction:column;gap:8px;z-index:6;background:var(--glass-strong)}
.composer input{border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:0;width:100%;min-height:36px}
.crow{display:flex;align-items:center;justify-content:space-between}
.cbtn{width:44px;height:44px;border-radius:50%;background:rgba(59,76,255,.1);color:var(--acc);display:grid;place-items:center}
.send{width:44px;height:44px;border-radius:50%;background:#0B0C10;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(14,16,22,.12),0 8px 18px -4px var(--shade);transition:transform .25s var(--spring),opacity .25s}
.send:disabled{opacity:.3;cursor:default}.send:not(:disabled):active{transform:scale(.9)}
[data-theme=dark] .send{background:#fff;color:#0B0C10;box-shadow:0 0 0 2px rgba(255,255,255,.22),0 8px 18px -4px var(--shade)}
.disc{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 88px);text-align:center;font-size:12px;color:var(--ink2);z-index:5;pointer-events:none}
.wl img{height:64px}.aibadge{top:-6px;right:-24px;width:28px;height:28px}
.welcome h1{font-size:30px;margin-top:14px}.welcome .sub{font-size:16px;margin-top:4px}.welcome .hint{font-size:15px;margin:8px 0 18px}
.sg{min-height:106px;padding:14px;gap:10px}.sg b{font-size:15.5px}.sgi{width:40px;height:40px;border-radius:13px}
.card2 b{font-size:15px;white-space:nowrap}.card2 .muted{font-size:12.5px}.dot{margin:0 2px 0 4px}
/* ---- AI page v2: docked composer, back pill, plain replies ---- */
#ai{display:flex;flex-direction:column;overflow:hidden;padding:0 0 calc(var(--bot) + 14px)}
.ai-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--top) + 76px) 16px 20px;scrollbar-width:none}.ai-scroll::-webkit-scrollbar{display:none}
.chat{gap:18px;padding-bottom:8px}
.composer{position:static;margin:0 16px;padding:12px 10px 10px 18px;border-radius:28px}
.disc{position:static;margin:8px 0 10px}
.cbtn,.send{position:relative;width:36px;height:36px;min-width:0;min-height:0}
.cbtn::before,.send::before{content:"";position:absolute;inset:-4px}
.send .ic{width:18px;height:18px;stroke-width:2}.cbtn .ic{width:20px;height:20px}
.aiback{align-self:center;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 12px;border-radius:22px;font-size:15px;font-weight:600;color:var(--ink);transition:transform .3s var(--spring)}
.aiback:active{transform:scale(.96)}
.aiback .ic:first-child{color:var(--ink2);transition:transform .3s var(--spring)}.aiback:active .ic:first-child{transform:translateX(-3px)}
.aiback .ic:nth-child(2){color:var(--acc)}
.msg.u{align-self:flex-end;max-width:82%;background:#DDE8FF;color:#0E1530;border-radius:22px 22px 6px 22px;padding:11px 16px;box-shadow:0 4px 14px -8px rgba(40,70,200,.35)}
.msg.a{align-self:stretch;max-width:100%;background:none;box-shadow:none;border-radius:0;padding:0 4px;font-size:16px;line-height:1.6;color:var(--ink)}
.msg.a.cur::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--acc);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* ---- niche profile hero ---- */
.nhero{position:relative;min-height:640px;display:flex;align-items:flex-end;border-radius:0 0 32px 32px;overflow:hidden;color:#fff;background:#10121a}
.nhero>svg{position:absolute;inset:0}
.nblur{position:absolute;left:0;right:0;bottom:0;height:72%;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
.nfade{position:absolute;left:0;right:0;bottom:0;height:76%;background:linear-gradient(transparent,rgba(6,8,18,.86) 72%)}
.ninfo{position:relative;z-index:2;width:100%;padding:0 16px 20px;text-align:center}
.ninfo h1{font-size:34px;font-weight:650;letter-spacing:-.8px}
.hd{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.66);font-size:15px;margin-top:2px}
.nrow{display:flex;gap:12px;margin-top:18px}
.fbtn{flex:1;height:52px;border-radius:26px;background:#fff;color:#0B0C10;font-weight:650;font-size:17px;transition:transform .25s var(--spring),background .25s,color .25s}
.fbtn:active{transform:scale(.97)}
.fbtn.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rbtn{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nstats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 16px}
.nstats b{display:block;font-size:26px;font-weight:650;letter-spacing:-.5px}.nstats span{font-size:12.5px;color:rgba(255,255,255,.66)}
.ndesc{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px;padding:14px 16px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.92);text-align:start;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
/* ---- AI back pill (left, smaller), slimmer sheet tabs ---- */
.aiback{align-self:flex-start;margin-left:16px;position:relative;height:38px;padding:0 14px 0 10px;gap:6px;font-size:14px}
.aiback::before{content:"";position:absolute;inset:-3px}
.aiback .ic{width:18px;height:18px}.aiback:active .ic:first-child{transform:translateX(3px)}
.seg{padding:3px;border-radius:18px}.seg .thumb{top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:15px}
.seg button{min-height:34px;font-size:13.5px;letter-spacing:.1px}
</style>

<div id="app">
  <!-- Root screens -->
  <section class="screen active" id="market" aria-label="Market"></section>
  <section class="screen" id="feed" aria-label="Feed"></section>
  <section class="screen" id="ai" aria-label="Blex AI"></section>

  <!-- Global top bar: menu button + glass search (shrinks on scroll) -->
  <div id="top" data-tab="market"><button class="gbtn glass" data-act="side" aria-label="Open menu"><svg class="ic nav"><use href="#i-menu"/></svg></button>
    <label class="search"><svg class="ic sm"><use href="#i-search"/></svg><input id="q" placeholder="Search products and niches" aria-label="Search" enterkeyhint="search"></label><span class="ttl">Blex AI</span></div>
  <!-- Feed header (centered title + Explore / Following), hides on scroll down -->
  <div id="feedTop"><div class="ft-title"><span>Feed</span></div>
    <div class="ft-tabs"><button class="on" data-ftab="all">Explore</button><button data-ftab="fol">Following</button></div></div>
  <!-- Floating Liquid Glass bar -->
  <nav class="bar glass" id="bar" data-i="0" aria-label="Main">
    <span class="pill"></span>
    <button class="item" data-tab="market" aria-current="true"><svg class="ic nav"><use href="#i-home"/></svg>Market</button>
    <button class="item" data-tab="feed"><svg class="ic nav"><use href="#i-feed"/></svg>Feed</button>
  </nav>

  <button class="fab glass" id="fab" data-act="create" aria-label="Create"><svg class="ic nav"><use href="#i-plus"/></svg></button>
  <!-- Side half-sheet -->

async function aiReply(text){
  await new Promise(r=>setTimeout(r,450));
  const t=text.toLowerCase();
  if(t.includes('unconfirmed'))return 'You have no unconfirmed orders right now. New ones appear in My orders as soon as a buyer checks out.';
  if(t.includes('published'))return 'You have not published any products or niches yet. Tap + on the Market page to create your first one.';
  if(t.includes('create'))return 'Tap + on the Market page, choose Niche, add a title, a cover and 5 to 8 related products. You can hide your identity with the anonymous switch.';
  if(t.includes('plan'))return 'You are on the Free plan. Upgrade options will appear here once billing is connected.';
  if(t.includes('niche'))return 'Try a niche around one routine: "Slow Mornings", "Night Desk" or "Trail Ready". Pick 5 to 8 products that belong together.';
  if(t.includes('price'))return 'Check three similar listings, then price 5 to 10% under the middle one. Add delivery to your cost, not the price.';
  if(t.includes('descr'))return 'Lead with what it does, then size and material, then one line on who it is for. Keep it under 60 words.';
  return 'This is a demo reply. In the next stage a real assistant will answer here.';
}

/* fast typewriter: ~3 chars every 16ms, instant if the user prefers reduced motion */
async function typeOut(el,text){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=text;return}
  el.classList.add('cur');
  for(let i=0;i<text.length;){i=Math.min(text.length,i+3);el.textContent=text.slice(0,i);$('#aiScroll').scrollTop=1e5;await new Promise(r=>setTimeout(r,16))}
  el.classList.remove('cur');
}
async function ask(text){

  const t=say('a','<div class="typing" style="padding:4px"><i></i><i></i><i></i></div>');
  const r=await aiReply(text); t.innerHTML=''; await typeOut(t,r);
}

  if(!$('#menu'))return;
  const row=(i,l,a,x='')=>`<button data-m="${a}" class="${S.sel===a?'sel':''}">${ic(i)}<span class="grow">${l}</span>${x}${S.sel===a?ic('chev','sm'):''}</button>`;
  const bd=n=>`<span class="bdg">${n}</span>`;
  $('#menu').innerHTML=row('box','My orders','orders',bd(DB.orders.length))+row('tag','My products','products',bd(DB.products.length))+row('grid','My niches','niches',bd(DB.niches.length))+'<hr>'+
    row('moon','Dark mode','theme',`<span class="sw ${S.theme==='dark'?'on':''}" role="switch" aria-checked="${S.theme==='dark'}"></span>`)+row('sliders','Settings','settings');
}

/* ============ 10. EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open]'); if(!t)return;
  const d=t.dataset;
  if(d.tab){ if(S.stack.length)return; setTab(d.tab); return }
  if(d.heart){S.liked[d.heart]=!S.liked[d.heart];t.classList.toggle('on',S.liked[d.heart]);return}
  if(d.follow!==undefined){const on=!S.followed.has(d.follow);on?S.followed.add(d.follow):S.followed.delete(d.follow);t.classList.toggle('on',on);t.textContent=on?'Following':'Follow';toast(on?'You follow this niche':'Unfollowed');return}
  if(d.ftab){S.fmode=d.ftab;$$('#feedTop [data-ftab]').forEach(b=>b.classList.toggle('on',b.dataset.ftab===d.ftab));$('#feed').innerHTML=feedView();$('#feed').scrollTop=0;return}
  if(d.chat){const c=DB.chats.find(x=>x.id===d.chat);setTab('ai');loadChat(c.msgs);openSide(false);return}
  if(d.newchat!==undefined){setTab('ai');loadChat([]);openSide(false);return}
  if(d.open){const[a,b]=d.open.split(':'); push(a,b); return}
  if(d.cat){renderMarket(d.cat,$('#q').value);return}
  if(d.act==='side'){renderSide();openSide(true);return}
  if(d.act==='back'){pop();return}
  if(d.act==='create'){openSheet(`<h3>Create</h3><p class="muted">Publish something new to Blex.</p>
    <button class="opt" data-create="product"><span class="gbtn glass">${ic('tag')}</span><span><b>Product</b><span class="muted">Sell one item</span></span></button>
    <button class="opt" data-create="niche"><span class="gbtn glass">${ic('grid')}</span><span><b>Niche</b><span class="muted">Group related products on one page</span></span></button>
    <button class="cta ghost" style="width:100%;margin-top:12px" data-act="close">Cancel</button>`);return}
  if(d.act==='close'){closeSheet();return}
  if(d.create){closeSheet();toast('Creation flow arrives in Stage 4');return}
  if(d.add){S.cart.push(d.add);toast(`Added to cart (${S.cart.length})`);return}
  if(d.like){S.liked[d.like]=!S.liked[d.like];t.classList.toggle('on',S.liked[d.like]);return}
  if(d.toast){toast(d.toast);return}
  if(d.ask){ask(d.ask);return}
  if(d.t){setTab(d.t);return}
  if(d.m){
    if(d.m==='anon'){DB.me.anon=!DB.me.anon;renderAnon();toast(DB.me.anon?'Your identity is hidden':'Your name is visible');return}
    if(d.m==='theme'){applyTheme(S.theme==='dark'?'light':'dark');renderMenu();return}
    S.sel=d.m;renderMenu();openSide(false);toast({orders:'Orders arrive in Stage 4',products:'My products arrive in Stage 4',niches:'My niches arrive in Stage 4',settings:'Settings arrive in Stage 6'}[d.m]);
  }
});
$('#scrim').onclick=()=>openSide(false); $('#scrim2').onclick=closeSheet;
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t)});
document.addEventListener('input',e=>{if(e.target.id==='q'){const v=e.target.value;renderMarket(S.cat,v);const i=$('#q');i.focus();i.setSelectionRange(v.length,v.length)}});
document.addEventListener('input',e=>{if(e.target.id==='cq')renderChatList(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='aiIn')$('#aiForm .send').disabled=!e.target.value.trim()});
document.addEventListener('submit',e=>{if(e.target.id==='aiForm'){e.preventDefault();const i=$('#aiIn');ask(i.value);i.value=''}});
document.addEventListener('scroll',e=>{const g=e.target;if(g.id==='gal'){const i=Math.round(g.scrollLeft/g.clientWidth);$$('.dots i',g.parentNode).forEach((d,k)=>d.classList.toggle('on',k===i))}},true);
document.addEventListener('scroll',e=>{const g=e.target;if(g.id==='market'||g.id==='aiScroll')$('#top').classList.toggle('sm',g.scrollTop>24);if(g.id==='feed'){const st=g.scrollTop,d=st-S.lastFeed;if(d>6&&st>20)$('#feedTop').classList.add('hide');else if(d<-6)$('#feedTop').classList.remove('hide');S.lastFeed=st}},true);
/* Draggable glass pill: press = grows, drag = follows finger, release = snaps to nearest item and returns to size */
(()=>{const bar=$('#bar');let id=null,moved=false,sx=0;
 const geo=()=>{const r=bar.getBoundingClientRect();return{l:r.left+4,iw:(r.width-8)/2,w:r.width,left:r.left}};
 bar.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;id=e.pointerId;moved=false;sx=e.clientX;bar.setPointerCapture(id);bar.classList.add('press')});
 bar.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;if(!moved&&Math.abs(e.clientX-sx)<4)return;moved=true;bar.classList.add('drag','squish');
  const g=geo(),x=Math.min(g.iw,Math.max(0,e.clientX-g.l-g.iw/2)),base=(+bar.dataset.i>0?1:0)*g.iw;
  bar.style.setProperty('--dx',(x-base)+'px');$$('#bar .item').forEach((b,k)=>b.setAttribute('aria-current',((x+g.iw/2>g.iw)?1:0)===k))});
 const end=e=>{if(e.pointerId!==id)return;id=null;const g=geo(),idx=(e.clientX-g.left)>g.w/2?1:0;
  bar.classList.remove('press','drag','squish');if(!moved){bar.classList.remove('pulse');void bar.offsetWidth;bar.classList.add('pulse')}bar.style.removeProperty('--dx');
  if(e.type==='pointerup'&&!S.stack.length)setTab(idx?'feed':'market');else setTab(S.tab)};
 bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);bar.addEventListener('animationend',()=>bar.classList.remove('pulse'))})();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.open)e.target.click();if(e.key==='Escape'){if(S.side)openSide(false);else closeSheet()}});
/* swipe the side sheet toward its edge to close (mirror for RTL in Stage 6) */
(()=>{const s=$('#side');let x0=null,dx=0;
  s.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0});
  s.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.max(0,x0-e.clientX);if(dx>8){s.style.transition='none';s.style.transform=`translateX(${-dx}px)`}});
  const end=()=>{if(x0===null)return;s.style.transition='';s.style.transform='';if(dx>90)openSide(false);x0=null};
  s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end)})();

/* ============ 11. THEME + BOOT ============ */
function applyTheme(t){S.theme=t;document.documentElement.dataset.theme=t}
applyTheme(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#market').innerHTML=skeleton();                     // loading state
$('#feed').innerHTML=feedView(); $('#ai').innerHTML=aiView(); renderSide();
setTimeout(()=>renderMarket('All',''),700);
</script>
