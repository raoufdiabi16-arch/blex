<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blex</title>
<meta name="theme-color" content="#F0F1F5">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blex"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* ============ 1. DESIGN TOKENS ============ */
:root{
  --bg:#F0F1F5; --card:#FFFFFF; --ink:#0E1016; --ink2:#5A6070; --line:rgba(14,16,22,.09);
  --acc:#1877F2; --acc-ink:#FFFFFF; --ok:#1E9E5A; --warn:#D9822B;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.85); --edge-dim:rgba(255,255,255,.35); --shade:rgba(20,24,48,.16);
  --tile-l:88%; --tile-s:62%;
  --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:12px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;
  --blur:22px; --sat:185%;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.35,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#08090D; --card:#15171F; --ink:#F4F5F9; --ink2:#9AA0B2; --line:rgba(255,255,255,.09);
  --acc:#4A9BFF; --acc-ink:#031226;
  --glass:rgba(34,36,48,.48); --glass-strong:rgba(34,36,48,.72);
  --edge:rgba(255,255,255,.26); --edge-dim:rgba(255,255,255,.1); --shade:rgba(0,0,0,.5);
  --tile-l:26%; --tile-s:42%;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#D5D8E2;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
[data-theme=dark] body{background:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;min-width:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}

/* ============ 2. APP SHELL ============ */
#app{position:relative;width:min(390px,100vw);height:min(844px,100dvh);background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:500px){#app{border-radius:48px;box-shadow:0 30px 80px var(--shade),0 0 0 10px #101116}}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--top) + 12px) var(--s2) var(--pb);background:var(--bg);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),transform .4s var(--ease);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;visibility:visible}
.screen.detail{z-index:20;transform:translateX(100%);opacity:1;visibility:visible;box-shadow:-20px 0 40px var(--shade)}
.screen.detail.in{transform:none}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:var(--s1)}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:-.8px}
.hdr .row{display:flex;gap:var(--s1)}
h2{font-size:20px;font-weight:650;letter-spacing:-.3px;margin:var(--s3) 0 12px}
.muted{color:var(--ink2);font-size:13px}

/* ============ 3. LIQUID GLASS COMPONENTS ============ */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  box-shadow:inset 0 0 0 1px var(--edge-dim),inset 0 1.5px 0 var(--edge),inset 0 -8px 14px -10px var(--edge-dim),0 10px 30px var(--shade)}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.gbtn:active{transform:scale(.92)}
.gbtn,.chip,.cta{transition:transform .25s var(--spring),background .2s}
.gcard{border-radius:var(--r-lg);padding:var(--s2)}
.cta{height:52px;border-radius:26px;background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:16px;padding:0 var(--s3);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:scale(.97)}
.cta.ghost{background:var(--glass);color:var(--ink)}
/* ---- floating Liquid Glass tab bar: flat thumb at rest, glass lens (magnified icon copy) while pressed or dragged ---- */
.dock{--d-ink:var(--ink2);--d-on:var(--acc);--d-bg:rgba(255,255,255,.5);--d-rim:rgba(255,255,255,.7);--d-shadow:0 10px 30px var(--shade);
  --d-rest:rgba(60,70,100,.10);--d-fill:rgba(255,255,255,.06);--d-hi:rgba(255,255,255,.98);--d-lo:rgba(255,255,255,.55);--d-in:rgba(10,20,50,.16);
  position:absolute;left:50%;bottom:calc(var(--bot) + 22px);width:208px;height:64px;margin-left:-104px;z-index:30;transition:transform .5s var(--ease),opacity .3s}
.dock.hide{transform:translateY(140px);opacity:0;pointer-events:none}
[data-theme=dark] .dock{--d-bg:rgba(28,30,42,.5);--d-rim:rgba(255,255,255,.16);--d-rest:rgba(255,255,255,.12);--d-fill:rgba(255,255,255,.08);--d-hi:rgba(255,255,255,.8);--d-lo:rgba(255,255,255,.3);--d-in:rgba(0,0,0,.35);--d-shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme] .dock.onfeed{--d-ink:rgba(255,255,255,.72);--d-on:#8DBBFF;--d-bg:rgba(16,18,28,.42);--d-rim:rgba(255,255,255,.18);--d-rest:rgba(255,255,255,.2);--d-fill:rgba(255,255,255,.08);--d-hi:rgba(255,255,255,.85);--d-lo:rgba(255,255,255,.3);--d-in:rgba(0,0,0,.35)}
.dk-bar{position:absolute;inset:0;border-radius:999px;background:var(--d-bg);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 0 0 1px var(--d-rim),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.05),var(--d-shadow);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
/* the real icons hide under the lens (cross-fade) so only the magnified copy shows there */
.dk-row{position:absolute;inset:0;display:flex;padding:0 5px;
  -webkit-mask-image:linear-gradient(90deg,#000 var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--mb,0px),#000 var(--mb,0px));
  mask-image:linear-gradient(90deg,#000 var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--mb,0px),#000 var(--mb,0px))}
.dock .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;min-width:0;padding:0;
  font-size:11px;font-weight:600;line-height:1;color:var(--d-ink);pointer-events:none;transition:color .18s}
.dock .item .ic{width:24px;height:24px;stroke-width:2}
.dock .item[aria-current=true]{color:var(--d-on)}
.dk-lens{position:absolute;left:0;top:0;pointer-events:none;border-radius:999px;overflow:hidden;will-change:transform,width,height;
  box-shadow:0 calc(8px*var(--k,0)) calc(26px*var(--k,0)) rgba(10,20,50,calc(.24*var(--k,0))),0 1px calc(3px*var(--k,0)) rgba(0,0,0,calc(.14*var(--k,0)))}
.dk-lens .rest{position:absolute;inset:0;background:var(--d-rest);opacity:calc(1 - var(--k,0))}
.dk-lens .glassf{position:absolute;inset:0;opacity:var(--k,0);background:var(--d-fill);
  -webkit-backdrop-filter:blur(2.5px) saturate(1.35) brightness(1.03);backdrop-filter:blur(2.5px) saturate(1.35) brightness(1.03);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.7),inset 0 -4px 7px var(--d-in),inset 0 0 12px rgba(255,255,255,.10)}
.dk-lens .mag{position:absolute;left:0;top:0;display:flex;padding:0 5px;transform-origin:0 0;opacity:var(--k,0)}
.dk-lens .mag .item{text-shadow:0 0 6px rgba(255,255,255,.3)}
.dk-lens::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;opacity:var(--k,0);
  background:linear-gradient(155deg,var(--d-hi),rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 62%,var(--d-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* chips */
.chips{display:flex;gap:var(--s1);overflow-x:auto;margin:0 calc(-1*var(--s2));padding:4px var(--s2);scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
/* side half-sheet */
.scrim{position:absolute;inset:0;background:rgba(6,8,16,.42);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.side{position:absolute;top:0;bottom:0;right:0;width:80%;z-index:41;border-radius:var(--r-xl) 0 0 var(--r-xl);padding:calc(var(--top) + 16px) var(--s2) calc(var(--bot) + 16px);transform:translateX(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;gap:var(--s2);touch-action:pan-y;background:var(--glass-strong)}
.side.on{transform:none}
.seg{position:relative;display:flex;padding:4px;border-radius:22px;background:var(--line)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:18px;background:var(--card);box-shadow:0 2px 8px var(--shade);transition:transform .45s var(--spring)}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;flex:1;min-height:40px;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button[aria-selected=true]{color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;text-align:start;min-height:52px;padding:0 8px;border-radius:var(--r-md);font-size:16px;font-weight:500}
.menu button:active{background:var(--line)}
.menu .grow{flex:1}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px var(--shade);transition:transform .35s var(--spring)}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
/* bottom modal sheet */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:51;border-radius:var(--r-xl);padding:var(--s3) var(--s2) var(--s2);transform:translateY(120%);transition:transform .5s var(--ease);background:var(--glass-strong)}
.sheet.on{transform:none}
.sheet h3{font-size:20px;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:12px;border-radius:var(--r-md);margin-top:8px;background:var(--card);min-height:64px}
.opt b{display:block;font-size:16px} .opt span.muted{display:block}
/* toast */
#toast{position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-90px);z-index:60;padding:12px 18px;border-radius:22px;font-size:14px;font-weight:600;max-width:88%;transition:transform .5s var(--spring);text-align:center}
#toast.on{transform:translate(-50%,0)}

/* ============ 4. CONTENT (cards, grids, skeleton) ============ */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);margin-bottom:12px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;min-width:0}
.tile{position:relative;display:grid;place-items:center;background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 45% 38%);overflow:hidden}
[data-theme=dark] .tile{color:hsl(var(--h) 60% 74%)}
.tile .ic{width:44px;height:44px;stroke-width:1.4}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--s2));padding:0 var(--s2) 8px;scrollbar-width:none}
.niche{position:relative;overflow:hidden;flex:none;width:286px;height:176px;border-radius:var(--r-lg);scroll-snap-align:start;text-align:start;padding:0;min-height:0}
.niche .tile{position:absolute;inset:0}
.niche .tile .ic{width:72px;height:72px;stroke-width:1.2;opacity:.55}
.niche .cap{position:absolute;left:10px;right:10px;bottom:10px;border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.niche .cap b{display:block;font-size:16px} .niche .cap span{font-size:12px;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:650}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{text-align:start;display:block;min-height:0;padding:0;min-width:0}
.pc .tile{aspect-ratio:1/1.05;border-radius:var(--r-lg);margin-bottom:8px}
.pc b{display:block;font-size:15px;font-weight:600;line-height:1.25} .pc .p{font-weight:700;margin-top:2px}
.pc .by{display:flex;align-items:center;gap:4px}
.sk{border-radius:var(--r-lg);background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 24px;color:var(--ink2)}
.sticky-cta{position:absolute;left:var(--s2);right:var(--s2);bottom:calc(var(--bot) + 16px);display:flex;gap:10px;z-index:5}
.sticky-cta .cta{flex:1}
.note{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;margin-top:12px;border-radius:var(--r-md);padding:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
/* feed */
#feed{padding:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;color:#fff}
.reel .tile{position:absolute;inset:0;color:rgba(255,255,255,.25);background:hsl(var(--h) 45% 30%)}
.reel .tile .ic{width:120px;height:120px;stroke-width:1}
.reel .info{position:absolute;left:var(--s2);right:84px;bottom:130px;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.reel .info::before{content:"";position:absolute;inset:-120px -40px -130px -40px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:-1}
.reel .info h3{font-size:22px;margin:6px 0 4px} .reel .info p{font-size:14px;opacity:.92}
.reel .acts{position:absolute;right:12px;bottom:130px;display:flex;flex-direction:column;gap:12px}
.reel .acts button{color:#fff} .reel .acts .on{color:#FF5C7A}
.reel .acts .on .ic{fill:currentColor}
.feed-top{position:absolute;top:calc(var(--top) + 12px);left:var(--s2);z-index:6;color:#fff;font-size:20px;font-weight:700;pointer-events:none}
/* ai */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.4;animation:pop .4s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-end-end-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-end-start-radius:6px}
.typing{display:flex;gap:4px;padding:14px} .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:bl 1s infinite} .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.4}}
.inbar{position:absolute;left:var(--s2);right:var(--s2);bottom:calc(var(--bot) + 100px);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;border-radius:28px;z-index:6}
.inbar input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;min-width:0}
.inbar .send{background:var(--acc);color:var(--acc-ink);border-radius:50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ============ 4b. STAGE 1.5 FIXES: bar contrast, art, cards, detail layout ============ */
:root{--pb:calc(114px + var(--bot))}
[data-theme=dark]{--acc:#4A9BFF}
.by{display:flex;align-items:center;gap:6px;min-width:0}
.art{width:100%;height:100%;display:block}
.screen.detail{padding:0;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;padding-bottom:var(--pb);scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.body{padding:20px 16px 0}
.pc{display:block;min-width:0;cursor:pointer}
.pc .img{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;margin-bottom:8px;box-shadow:0 10px 22px -12px var(--shade)}
.pc .t{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .p{font-weight:700;font-size:16px;margin:2px 0}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;min-width:0;min-height:0;color:var(--ink)}
.heart::before{content:"";position:absolute;inset:-4px}
.heart.on{color:#FF4D6D}.heart.on .ic{fill:currentColor}
.sh{display:flex;align-items:center;justify-content:space-between;margin:28px 0 8px}.sh h2{margin:0}
.link{color:var(--acc);font-weight:600;font-size:15px;padding:0 4px}
.collage{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:100%}
.collage>div{overflow:hidden;position:relative}.collage>div:first-child{grid-row:span 2}
.niche .collage{position:absolute;inset:0}
.hero{position:relative;height:240px;border-radius:0 0 28px 28px;overflow:hidden}
.hero .cap{position:absolute;left:12px;right:12px;bottom:12px;border-radius:22px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--glass-strong)}
.hero .cap b{display:block;font-size:20px;letter-spacing:-.3px}
.cr{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;margin-top:2px}
.av{width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.topbtns{position:absolute;left:12px;right:12px;top:calc(var(--top) + 12px);display:flex;justify-content:space-between;z-index:7;pointer-events:none}.topbtns>*{pointer-events:auto}
.galw{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:4/5;border-radius:0 0 28px 28px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:center}
.dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px 10px;border-radius:14px;background:var(--glass-strong)}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ink);opacity:.35;transition:width .3s var(--spring),opacity .3s}.dots i.on{width:18px;opacity:1}
.abar{position:absolute;left:12px;right:12px;bottom:calc(var(--bot) + 12px);height:72px;border-radius:36px;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 24px;z-index:6}
.abar b{display:block;font-size:22px;letter-spacing:-.4px}
.abar .cta{height:52px}
.reel .bg{position:absolute;inset:0}
.car{scroll-padding-inline:16px}
.niche .cap{background:var(--glass-strong)}
.abar{background:var(--glass-strong)}
.reel .badge{background:rgba(0,0,0,.35)}
/* compact bar, FAB, left-side menu */
.ic.nav{stroke-width:2}
.fab{position:absolute;right:16px;bottom:calc(var(--bot) + 28px);width:46px;height:46px;min-width:0;min-height:0;border-radius:50%;display:grid;place-items:center;z-index:30;color:var(--acc);transition:transform .5s var(--ease),opacity .3s}
.fab:active{transform:scale(.92)}
.fab.hide{transform:translateY(120px) scale(.8);opacity:0;pointer-events:none}
.hdr{justify-content:flex-start;gap:12px}

  DB.niches.forEach(n=>{n.tags=T[n.id]||[];n.rating=R[n.id]||4.8;n.verified=n.id!=='n2'});
  const W={p1:680,p2:520,p3:900,p4:150,p5:640,p6:360,p7:420,p8:210},RT={p1:4.9,p2:4.8,p3:4.7,p4:4.6,p5:4.8,p6:4.9,p7:4.7,p8:4.8};
  const H={p1:3,p2:26,p3:120,p4:456,p5:1680,p6:9,p7:960,p8:48};
  DB.products.forEach(p=>{p.wt=W[p.id]||500;p.rt=RT[p.id]||4.8;p.at=Date.now()-(H[p.id]||48)*36e5})})();
const nProds=id=>DB.products.filter(p=>p.niche===id||(p.feat&&p.feat.includes(id)));
const money=n=>Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+'\u00A0DA';
const seller=id=>id===DB.me.id?DB.me:DB.sellers[id];
const sellerLabel=id=>seller(id).anon?`<span class="by muted">${ic('eyeoff','sm')}Anonymous</span>`:`<span class="by muted">${seller(id).name}</span>`;
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.toggle('low',!!S.side);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

const S={tab:'market',stack:[],side:false,cart:[],liked:{},saved:{},theme:null,followed:new Set(),fmode:'all',lastFeed:0,sel:'orders'};
/* ---- local persistence (localStorage; silently skipped when the browser blocks it) ---- */
const LS={load(){try{return JSON.parse(localStorage.getItem('blex.v1'))||{}}catch(e){return{}}},save(o){try{localStorage.setItem('blex.v1',JSON.stringify(o))}catch(e){}}};
const SAVED=LS.load();
Object.assign(S.liked,SAVED.liked||{});Object.assign(S.saved,SAVED.saved||{});(SAVED.followed||[]).forEach(x=>S.followed.add(x));
S.cart=SAVED.cart||[];S.themeUser=!!SAVED.theme;DB.me.anon=!!SAVED.anon;
function saveState(){LS.save({liked:S.liked,saved:S.saved,followed:[...S.followed],cart:S.cart,anon:DB.me.anon,theme:S.themeUser?S.theme:null})}
function feedHdr(show){$('#feedTop').classList.toggle('hide',!show);$('#stories').classList.toggle('on',!show&&S.tab==='feed'&&!S.stack.length)}
/* stories */
S.storySeen=new Set();S.sv=null;
function storyProduct(st){return DB.products.find(p=>p.art===st.art&&p.h===st.h)||DB.products.find(p=>p.art===st.art)||null}
function renderSv(){
  const v=$('#sv');if(!v)return;const st=DB.stories[S.sv],pr=storyProduct(st);S.storySeen.add(S.sv);
  const su=pr&&prodImg(pr);$('.sv-art',v).innerHTML=su?`<img src="${su}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`:scene(pr?pr.art:st.art,pr?pr.h:st.h,0);
  const art=$('.sv-art',v);art.classList.remove('swap');void art.offsetWidth;art.classList.add('swap');
  $('.sv-seg',v).innerHTML=DB.stories.map((_,i)=>`<i class="${i<=S.sv?'on':''}"></i>`).join('');
  $('.sv-who .av3',v).innerHTML=scene(st.art,st.h,2);$('.sv-who b',v).textContent=st.n;
  $('.sv-info b',v).textContent=pr?pr.name:'';$('.sv-info span',v).textContent=pr?money(pr.price)+' · '+pr.cat:'';
  $('.sv-go',v).style.display=pr?'':'none';
}
function openStory(i){
  if($('#sv'))return;S.sv=i;
  const v=document.createElement('div');v.id='sv';v.className='sv';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');v.setAttribute('aria-label','Product story');
  v.innerHTML=`<div class="sv-art"></div><div class="sv-shade t"></div><div class="sv-shade b"></div>
    <button class="sv-zone p" data-sv="prev" aria-label="Previous product"></button><button class="sv-zone n" data-sv="next" aria-label="Next product"></button>
    <div class="sv-top"><div class="sv-seg"></div><div class="sv-who"><span class="av3"></span><b></b><button class="sv-x" data-sv="close" aria-label="Close">${ic('x')}</button></div></div>
    <div class="sv-bot"><div class="sv-info"><b></b><span></span></div><button class="sv-go" data-sv="visit">Visit product${ic('chevr','sm')}</button></div>`;
  v.addEventListener('click',e=>{const b=e.target.closest('[data-sv]');if(!b)return;e.stopPropagation();const a=b.dataset.sv;
    if(a==='close')closeStory();
    else if(a==='next'){S.sv+1<DB.stories.length?(S.sv++,renderSv()):closeStory()}
    else if(a==='prev'){if(S.sv>0){S.sv--;renderSv()}}
    else if(a==='visit'){const pr=storyProduct(DB.stories[S.sv]);if(pr){S.svDepth=S.stack.length;v.classList.add('away');push('product',pr.id,null)}}});
  $('#app').appendChild(v);renderSv();requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('in')));
}
function closeStory(now){
  const v=$('#sv');if(!v)return;
  $$('#stRow .st').forEach(b=>{if(S.storySeen.has(+b.dataset.story))b.classList.add('seen')});
  v.classList.remove('in');if(now)v.remove();else setTimeout(()=>v.remove(),320);
}
document.addEventListener('keydown',e=>{const sv=$('#sv');if(!sv||sv.classList.contains('away'))return;if(e.key==='Escape')closeStory();else if(e.key==='ArrowRight')$('.sv-zone.n').click();else if(e.key==='ArrowLeft')$('.sv-zone.p').click()});
function renderStories(){const L=DB.stories.map((p,i)=>({p,i})).filter(x=>!S.storySeen.has(x.i));$('#stories').classList.toggle('empty',!L.length);$('#stRow').innerHTML=L.map(({p,i})=>`<button class="st" data-story="${i}" aria-label="${p.n}'s story"><span class="ring"><span class="av3">${scene(p.art,p.h,2)}</span></span><span class="nm">${p.n}</span></button>`).join('')}
function syncChrome(){const root=!S.stack.length;$('#bar').classList.toggle('hide',!root||S.tab==='ai');$('#fab').classList.toggle('hide',!(root&&S.tab==='market'));$('#top').classList.toggle('hide',!(root&&S.tab!=='feed'));$('#top').dataset.tab=S.tab;const fo=root&&S.tab==='feed';$('#feedTop').classList.toggle('on',fo);if(fo){S.lastFeed=$('#feed').scrollTop;feedHdr(true)}else $('#stories').classList.remove('on');const sc=document.getElementById(S.tab==='ai'?'aiScroll':S.tab);$('#top').classList.toggle('sm',!!sc&&S.tab!=='feed'&&sc.scrollTop>24)}
function setTab(t){
  const was=S.tab;S.tab=t;if(t==='feed'&&was!=='feed')renderStories();$('#bar').classList.toggle('onfeed',t==='feed');syncChrome();if(S.side)renderSide();
  $$('.screen:not(.detail)').forEach(s=>s.classList.toggle('active',s.id===t));
  if(t==='market'||t==='feed')barUI.sync(t);
  const seg=t==='ai'?1:0; $('#seg').dataset.i=seg;
  $$('#seg button').forEach((b,k)=>b.setAttribute('aria-selected',k===seg));
}
/* Zoom transition: the page grows out of the tapped card (card image = gallery image, both 4/5) and shrinks back into it on close.
   Sources that are not cards (Feed button, links inside pages) use a soft scale + fade instead. */
function zoomState(src){
  const card=src&&src.isConnected&&src.closest('.pc,.niche'); if(!card)return null;
  const isP=card.classList.contains('pc'), box=isP?card.querySelector('.img'):card, r=box.getBoundingClientRect(), A=$('#app').getBoundingClientRect();
  if(r.width<10||r.bottom<A.top+20||r.top>A.bottom-20)return null;
  const k=r.width/A.width, H=r.height/k, rad=(isP?20:24)/k;
  return{t:`translate(${r.left-A.left}px,${r.top-A.top}px) scale(${k})`,c:`inset(0px 0px ${A.height-H}px 0px round ${rad}px)`};
}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* tiny, safe markdown: input is escaped first, then **bold**, *italic*, `code`, lists and paragraphs */
function md(src){
  const inline=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const ln of esc(src).split('\n')){
    let m;
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`}
    else if(!ln.trim())close();
    else{close();out+=`<p>${inline(ln)}</p>`}
  }
  close();return out;
}

async function aiReply(msgs){
  if(!navigator.onLine)throw new Error('offline');
  await sleep(450);
  if(window.__aiFail){window.__aiFail=false;throw new Error('boom')}
  return mockReply(msgs[msgs.length-1].content);
}
async function typeOut(el,text,run){
  const box=el.querySelector('.md');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){box.innerHTML=md(text);return text}
  el.classList.add('cur');let i=0;
  while(i<text.length&&!AI.stop&&AI.run===run){i=Math.min(text.length,i+3);box.innerHTML=md(text.slice(0,i));aiEnd();await sleep(16)}
  el.classList.remove('cur');
  const shown=(AI.stop&&AI.run===run)?text.slice(0,i):text;box.innerHTML=md(shown);return shown;
}
function addMsg(role,html){
  $('#ai').classList.add('has-chat');
  $('#chat').insertAdjacentHTML('beforeend',role==='u'?`<div class="msg u">${html}</div>`:`<div class="msg a"><div class="md">${html}</div><div class="mact-row"></div></div>`);

async function ask(text,isRegen){
  text=String(text||'').trim();if(!text||AI.busy)return;
  if(!S.chat){S.chat={id:'c'+Date.now(),title:titleOf(text),ts:Date.now(),msgs:[]};DB.chats.unshift(S.chat);if($('#chatList'))renderChatList($('#cq')?$('#cq').value:'')}
  const chat=S.chat,run=++AI.run;AI.stop=false;AI.stick=true;
  if(!isRegen){chat.msgs.push(['u',text]);addMsg('u',userHTML(text))}
  setBusy(true);
  const el=addMsg('a','<div class="typing" style="padding:4px"><i></i><i></i><i></i></div>');aiEnd(true);
  let reply='';
  try{
    reply=await aiReply(chat.msgs.map(m=>({role:m[0]==='u'?'user':'assistant',content:ctxText(m[1])})));
    if(AI.run!==run){chat.msgs.push(['a',reply]);saveChats();return}          /* user left this chat mid-reply: keep the answer in its history */
    if(AI.stop){el.remove();if(!$$('#chat .msg').length)$('#ai').classList.remove('has-chat');return}
    const shown=await typeOut(el,reply,run);
    if(AI.run!==run){chat.msgs.push(['a',reply]);saveChats();return}
    chat.msgs.push(['a',shown]);el.setAttribute('data-raw',shown);
    $$('#chat .mact-row [data-regen]').forEach(b=>b.remove());
    el.querySelector('.mact-row').innerHTML=actsHTML(true);
    $('#aiSR').textContent=shown;                                              /* announce the finished reply once, not every typed character */
  }catch(err){
    if(AI.run===run){
      el.classList.add('err');
      el.querySelector('.md').innerHTML=`${navigator.onLine?'Something went wrong.':'You appear to be offline.'} <button class="retry" data-retry>Try again</button>`;
    }
  }finally{
    if(AI.run===run){setBusy(false);saveChats();aiEnd()}
  }
}

document.addEventListener('click',e=>{

  if(d.open){const[a,b]=d.open.split(':'); push(a,b,t); return}

/* Liquid Glass tab bar. Rest: flat thumb behind the active tab. Press/drag: a glass lens grows, follows the finger
   and shows a magnified copy of the icons. Release: the lens springs to the nearest tab and shrinks back. */
const barUI=(()=>{
  const wrap=$('#bar'),bar=$('#dkBar'),row=$('#dkRow'),lens=$('#dkLens'),mag=$('#dkMag');
  const tabs=$$('.item',row);
  mag.innerHTML=row.innerHTML;
  const magTabs=$$('.item',mag);magTabs.forEach(b=>{b.tabIndex=-1;b.removeAttribute('data-tab')});
  const MAG=1.18,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W=0,H=0,tw=0,centers=[],selected=0,releaseT=0;
  const St={x:0,vx:0,tx:0,k:0,vk:0,tk:0,drag:false,moved:false};
  const clampX=x=>Math.max(centers[0],Math.min(centers[centers.length-1],x));
  const nearest=x=>centers.reduce((b,c,i)=>Math.abs(c-x)<Math.abs(centers[b]-x)?i:b,0);
  const localX=e=>e.clientX-wrap.getBoundingClientRect().left;
  function setActive(i){[tabs,magTabs].forEach(L=>L.forEach((b,j)=>b.setAttribute('aria-current',j===i)))}
  function measure(){
    const r=wrap.getBoundingClientRect();W=r.width;H=r.height;
    mag.style.width=W+'px';mag.style.height=H+'px';
    centers=tabs.map(t=>{const b=t.getBoundingClientRect();return b.left-r.left+b.width/2});
    tw=tabs[0].getBoundingClientRect().width;
  }
  bar.addEventListener('pointerdown',e=>{
    if(!e.isPrimary)return;
    bar.setPointerCapture(e.pointerId);clearTimeout(releaseT);
    St.drag=true;St.moved=false;St.tk=1;St.tx=centers[nearest(localX(e))];setActive(nearest(St.tx));
  });
  bar.addEventListener('pointermove',e=>{
    if(!St.drag)return;
    St.moved=true;St.tx=clampX(localX(e));setActive(nearest(St.tx));
  });
  const end=e=>{
    if(!St.drag)return;St.drag=false;
    const i=e.type==='pointercancel'?selected:nearest(St.tx);
    selected=i;setActive(i);St.tx=centers[i];
    releaseT=setTimeout(()=>{St.tk=0},St.moved?0:30);   /* a plain tap keeps the lens up for a beat */
    if(e.type==='pointerup'&&!S.stack.length)setTimeout(()=>setTab(i?'feed':'market'),0);
  };
  bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.033,(now-last)/1000);last=now;
    if(RM||!W){St.x=St.tx;St.k=St.tk;St.vx=St.vk=0}
    else{
      const kx=St.drag?1500:1500,cx=St.drag?78:76,h=dt/2;            /* stiffer + near critical damping: quick, no wobble */
      for(let n=0;n<2;n++){
        St.vx+=(-(St.x-St.tx)*kx-St.vx*cx)*h;St.x+=St.vx*h;
        St.vk+=(-(St.k-St.tk)*1100-St.vk*64)*h;St.k+=St.vk*h}
    }
    const k=Math.max(0,Math.min(1.04,St.k)),kk=Math.min(1,k);
    const restW=tw-8,restH=H-10,lensW=tw+16,lensH=H+12;
    const lw=restW+(lensW-restW)*k,lh=restH+(lensH-restH)*k,cy=H/2;
    lens.style.setProperty('--k',kk.toFixed(3));
    lens.style.width=lw+'px';lens.style.height=lh+'px';
    lens.style.transform=`translate3d(${St.x-lw/2}px,${cy-lh/2}px,0)`;
    const s=1+(MAG-1)*kk;
    mag.style.transform=`translate(${lw/2-s*St.x}px,${lh/2-s*cy}px) scale(${s})`;
    row.style.setProperty('--ma',(St.x-lw/2+4).toFixed(1)+'px');
    row.style.setProperty('--mb',(St.x+lw/2-4).toFixed(1)+'px');
    row.style.setProperty('--mi',(1-kk).toFixed(3));
    requestAnimationFrame(frame);
  }
  function sync(t){            /* called by setTab so the thumb follows any navigation (e.g. the Back-to-Market pill) */
    const i=t==='feed'?1:0;selected=i;setActive(i);if(!St.drag){clearTimeout(releaseT);St.tx=centers[i];St.tk=0}
  }
  function init(jump){measure();if(jump)St.x=St.tx=centers[selected];else St.tx=centers[selected];setActive(selected)}
  addEventListener('resize',()=>init(true));
  document.fonts&&document.fonts.ready.then(()=>init(true));
  init(true);requestAnimationFrame(frame);
  return{sync,remeasure:()=>init(true)};
})();

    if(a==='per'){S.mgPer=+b.dataset.v;mgRefresh();return}
    if(a==='edit'){mgEditProduct(id);return}if(a==='niche'){mgNicheSheet(id);return}
    if(a==='hide'){const p=DB.products.find(x=>x.id===id);p.hidden=!p.hidden;renderMarket(S.cat,$('#q').value);mgRefresh();return}
    if(a==='del'){mgConfirm('Delete this product?','It disappears from the market and from its niches.',()=>{DB.products=DB.products.filter(x=>x.id!==id);pop();renderMarket(S.cat,$('#q').value);toast('Product deleted')});return}
    if(a==='nedit'){mgEditNiche(id);return}if(a==='addp'){mgAddProducts(id);return}
    if(a==='rmp'){const p=DB.products.find(x=>x.id===b.dataset.id);if(p.niche===id)p.niche=null;if(p.feat)p.feat=p.feat.filter(x=>x!==id);mgRefresh();return}
    if(a==='appr'||a==='decl'){const r=DB.reqs.find(x=>x.id===b.dataset.id);r.status=a==='appr'?'approved':'declined';if(a==='appr'){const p=DB.products.find(x=>x.id===r.pid);p.feat=p.feat||[];p.feat.push(r.nid)}mgRefresh();return}
    if(a==='ndel'){mgConfirm('Delete this niche?','Its products stay published.',()=>{DB.products.forEach(p=>{if(p.niche===id)p.niche=null;if(p.feat)p.feat=p.feat.filter(x=>x!==id)});DB.niches=DB.niches.filter(x=>x.id!==id);pop();renderMarket(S.cat,$('#q').value);toast('Niche deleted')});return}})}
/* ---- notifications & cart ---- */
DB.notifs=[{id:'n0',i:'truck',t:'Your order is on its way',s:'Order #O1 · '+((DB.products.find(x=>x.id==='p5')||{}).name||'your product'),at:Date.now()-30*36e5,unread:true}];
function hdrUpdate(){const b=document.getElementById('hdBell'),c=document.getElementById('hdCart'),u=DB.notifs.filter(n=>n.unread).length;
  if(b){b.hidden=!u;b.textContent=u}if(c){c.hidden=!S.cart.length;c.textContent=S.cart.length}}
function notify(i,t,s){DB.notifs.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,5),i,t,s,at:Date.now(),unread:true});hdrUpdate()}
function notifsView(){
  const L=DB.notifs,now=Date.now(),isNew=n=>n.unread;
  const row=n=>`<div class="nt-r ${n.unread?'un':''}"><span class="nt-i">${ic(n.i)}</span><div class="nt-x"><b>${esc(n.t)}</b><span>${esc(n.s)}</span></div><div class="nt-m"><span>${ago(n.at)}</span>${n.unread?'<i></i>':''}</div></div>`;
  const today=L.filter(n=>now-n.at<864e5),older=L.filter(n=>now-n.at>=864e5);
  const body=L.length?(today.length?`<div class="od-g"><b>Today</b><span>${today.length}</span></div>${today.map(row).join('')}`:'')+(older.length?`<div class="od-g"><b>Earlier</b><span>${older.length}</span></div>${older.map(row).join('')}`:''):`<div class="empty">${ic('bell')}<h2>No notifications</h2><p>Order updates and approvals show up here.</p></div>`;
  L.forEach(n=>n.unread=false);setTimeout(hdrUpdate,0);
  return `<div class="scroll np"><div class="np-top"><div class="np-tr"><button class="gbtn glass" data-act="back" aria-label="Back">${ic('back')}</button><div><h1>Notifications</h1><small>${L.length} in total</small></div></div></div><div class="od-wrap">${body}</div></div>`}
const cartItems=()=>S.cart.map(id=>DB.products.find(p=>p.id===id)).filter(Boolean);
function cartView(){
  const L=cartItems(),fee=L.reduce((a,p)=>a+feeOf(p),0),tot=L.reduce((a,p)=>a+p.price,0);
  const row=p=>`<div class="ct-r" data-open="product:${p.id}"><span class="ct-t">${pimg(p)}</span><span class="ct-x"><b>${esc(p.name)}</b><span>${money(p.price)} on delivery · fee ${money(feeOf(p))}</span></span><button class="ct-d" data-ct="rm" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">${ic('x','sm')}</button></div>`;
  const body=L.length?`<section class="mg-c">${L.map(row).join('')}</section>
    <section class="mg-c"><div class="pay-r" style="border:0;padding-top:0"><span>Delivery fees, paid now</span><b>${money(fee)}</b></div><div class="pay-r"><span>Products, paid on delivery</span><b>${money(tot)}</b></div></section>`
    :`<div class="empty">${ic('cart')}<h2>Your cart is empty</h2><p>Tap the bag on a product to save it here.</p><button class="np-go" data-act="back" style="margin-top:14px;padding:0 24px">Browse the market</button></div>`;
  return `<div class="scroll np"><div class="np-top"><div class="np-tr"><button class="gbtn glass" data-act="back" aria-label="Back">${ic('back')}</button><div><h1>Cart</h1><small>${L.length} item${L.length===1?'':'s'}</small></div></div></div>${body}</div>
    ${L.length?`<div class="np-bar glass"><button class="np-go" data-ct="pay"><span>Pay delivery fees</span><em>${money(fee)}</em></button></div>`:''}`}
function placeOrder(p){DB.orders.unshift({id:'o'+(DB.orders.length+1)+Date.now().toString(36).slice(-3),product:p.id,status:'Awaiting confirmation',deliveryFee:feeOf(p),feePaid:true,placedAt:Date.now(),statusAt:Date.now(),deadlineH:72});notify('bag','Order placed',p.name+' · the seller confirms within 72 hours')}
function cartInit(el){el.addEventListener('click',e=>{const b=e.target.closest('[data-ct]');if(!b)return;e.stopPropagation();
  if(b.dataset.ct==='rm'){S.cart=S.cart.filter(x=>x!==b.dataset.id);saveState();hdrUpdate();el.innerHTML=cartView();return}
  if(b.dataset.ct==='pay'){const L=cartItems();L.forEach(placeOrder);S.cart=[];saveState();hdrUpdate();pop();toast(L.length+' order'+(L.length===1?'':'s')+' placed. Delivery fees paid.');qkUpdate()}})}
/* ---- location (Market top panel) ---- */
const LOC_KEY='blex.loc';
S.loc=(()=>{try{const v=localStorage.getItem(LOC_KEY);return v===null?'Algeria':(v===''?null:v)}catch(e){return'Algeria'}})();
function applyLoc(rerender){
  const on=!!S.loc;$('#top').classList.toggle('noloc',!on);$('#app').classList.toggle('hasloc',on);
  const e=$('#locT');if(e)e.textContent=S.loc||'Algeria';
  try{localStorage.setItem(LOC_KEY,S.loc===null?'':S.loc)}catch(x){}
  if(rerender)renderMarket(S.cat,$('#q').value)}
function openLoc(){
  if($('#cs'))return;
  const ck='<svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const opt=(v,l,all)=>`<button class="cs-opt ${all?'all':''}" data-sc="${esc(v)}" aria-pressed="${S.loc===v}"><span>${l}</span>${S.loc===v?ck:''}</button>`;
  const el=document.createElement('div');el.id='cs';el.className='cs';
  el.innerHTML=`<div class="cs-scrim" data-sc-close></div><div class="cs-sheet glass" role="dialog" aria-modal="true" aria-label="Choose your location"><div class="cs-grab"></div>
    <div class="cs-head"><div><b>Choose your location</b><span>Show products from all of Algeria or one wilaya</span></div><button class="cs-x" data-sc-close aria-label="Close">${ic('x')}</button></div>
    <div class="cs-list">${opt('Algeria','All Algeria',1)}${WILAYAS.map(w=>opt(w,esc(w))).join('')}</div></div>`;
  el.addEventListener('click',e=>{
    if(e.target.closest('[data-sc-close]')){closeCity();return}
    const b=e.target.closest('[data-sc]');if(b){S.loc=b.dataset.sc;applyLoc(true);closeCity()}});
  $('#app').appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')))}
/* ---- search page ---- */
const RECENT_KEY='blex.recent';
const getRecent=()=>{try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){return[]}};
const setRecent=a=>{try{localStorage.setItem(RECENT_KEY,JSON.stringify(a.slice(0,8)))}catch(e){}};
function srBody(q){
  const t=q.trim().toLowerCase(),R=getRecent(),row=(v,i,del)=>`<div class="sr-r" style="padding:0"><button class="sr-r" style="border:0;flex:1;min-width:0" data-sr="${esc(v)}"><span class="sr-ic">${ic(i,'sm')}</span><span class="t">${esc(v)}</span></button>${del?`<button class="sr-d" data-srdel="${esc(v)}" aria-label="Remove ${esc(v)}">${ic('x','sm')}</button>`:''}</div>`;
  if(t){
    const names=[...DB.products.map(p=>p.name),...DB.niches.map(n=>n.name)].filter(n=>n.toLowerCase().includes(t)).slice(0,5);
    return `<div class="sr-h"><b>Suggestions</b></div>`+row(q.trim(),'search')+names.filter(n=>n.toLowerCase()!==t).map(n=>row(n,'tag')).join('')}
  return `<div class="sr-h"><b>Explore</b></div><div class="sr-map">${mapCard()}<p>Find stores near you, call them or get directions.</p></div>`
    +`<div class="sr-h"><b>Recent searches</b>${R.length?'<button data-srclear>Clear</button>':''}</div>`
    +(R.length?R.map(v=>row(v,'search',1)).join(''):'<p class="sr-e">Your recent searches will appear here.</p>')}
function openSearch(){
  if($('#sr'))return;
  const el=document.createElement('div');el.id='sr';el.className='spg';el.setAttribute('role','dialog');el.setAttribute('aria-label','Search');
  const cur=$('#q').value;
  el.innerHTML=`<div class="sr-top"><label class="search">${ic('search','sm')}<input id="srIn" value="${esc(cur)}" placeholder="Search products and niches" aria-label="Search" enterkeyhint="search" autocomplete="off"></label><button class="sr-x" data-srx>Cancel</button></div><div class="sr-body" id="srBody">${srBody(cur)}</div>`;
  $('#app').appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('in');const i=$('#srIn');i.focus();i.setSelectionRange(i.value.length,i.value.length)}));
  const run=v=>{v=v.trim();if(v){const R=getRecent().filter(x=>x.toLowerCase()!==v.toLowerCase());R.unshift(v);setRecent(R)}$('#q').value=v;renderMarket(S.cat,v);closeSearch()};
  el.addEventListener('input',e=>{if(e.target.id==='srIn')$('#srBody').innerHTML=srBody(e.target.value)});
  el.addEventListener('keydown',e=>{if(e.target.id==='srIn'&&e.key==='Enter'){e.preventDefault();run(e.target.value)}});
  el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.srx!==undefined){closeSearch();return}
    if(b.dataset.sr!==undefined){e.stopPropagation();run(b.dataset.sr);return}
    if(b.dataset.srdel!==undefined){e.stopPropagation();setRecent(getRecent().filter(x=>x!==b.dataset.srdel));$('#srBody').innerHTML=srBody($('#srIn').value);return}
    if(b.dataset.srclear!==undefined){e.stopPropagation();setRecent([]);$('#srBody').innerHTML=srBody($('#srIn').value);return}
    if(b.dataset.act==='maps')closeSearch()})}
function closeSearch(){const el=$('#sr');if(!el)return;el.classList.remove('in');el.querySelector('input')?.blur();setTimeout(()=>el.remove(),450)}
document.addEventListener('focusin',e=>{if(e.target.id==='q'){e.target.blur();openSearch()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});
/* blexmaps: scrolling the list lifts the sheet, hides the wordmark and moves the city pill into the tabs; scrolling back up restores it */
document.addEventListener('scroll',e=>{const g=e.target;if(g.id!=='mpList')return;const h=$('#mpSheet');if(!h)return;const st=g.scrollTop,d=st-(S.mpLast||0);S.mpLast=st;if(d>6&&st>24)h.classList.add('up');else if(d<-6||st<8)h.classList.remove('up')},true);
document.addEventListener('scroll',e=>{const t=e.target;if(t.id==='aiScroll')AI.stick=t.scrollHeight-t.scrollTop-t.clientHeight<90},true);
document.addEventListener('focusin',e=>{if(e.target.id==='aiIn'){AI.stick=true;setTimeout(()=>aiEnd(true),300)}});
/* keep the composer above the iOS keyboard: size the app to the visual viewport while the keyboard is open */
if(window.visualViewport){const vv=visualViewport,A=$('#app');const fit=()=>{const kb=innerWidth<500&&vv.height<innerHeight-120;A.style.height=kb?vv.height+'px':'';A.style.transform=kb?`translateY(${vv.offsetTop}px)`:'';if(kb)aiEnd()};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}

document.addEventListener('input',e=>{if(e.target.id==='mq'){S.mp.q=e.target.value;renderMp()}});

/* ============ 11. THEME + BOOT ============ */
function applyTheme(t){S.theme=t;document.documentElement.dataset.theme=t}
applyTheme(SAVED.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#market').innerHTML=skeleton();                     // loading state
$('#feed').innerHTML=feedView(); $('#ai').innerHTML=aiView(); renderSide();renderStories();applyLoc(true);
setTimeout(()=>renderMarket('All',''),700);
</script>
